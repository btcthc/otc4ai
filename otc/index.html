<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INBREAZ OTC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root { --bg:#f5f4ef; --card:#fff; --ink:#1a1c21; --mute:#6c707a; --line:#e3e1d9; --acc:#e8730c; --ok:#1f7a5a; --bad:#c0392b; --field:#faf9f5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111216; --card:#1a1c22; --ink:#ecebe6; --mute:#9a9ea8; --line:#2a2d35; --acc:#ff9a3c; --ok:#4cc39a; --bad:#ff6b5b; --field:#14151a; } }
:root[data-theme="dark"] { --bg:#111216; --card:#1a1c22; --ink:#ecebe6; --mute:#9a9ea8; --line:#2a2d35; --acc:#ff9a3c; --ok:#4cc39a; --bad:#ff6b5b; --field:#14151a; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 Inter, system-ui, sans-serif; }
.wrap { max-width:1120px; margin:0 auto; padding:22px 16px 60px; }
header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
h1 { font-size:22px; margin:0; letter-spacing:-.01em; } h1 span { color:var(--acc); }
h2 { font-size:16px; margin:0 0 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; } h3 { font-size:14px; margin:16px 0 6px; }
.status { font-size:13px; padding:4px 10px; border-radius:99px; border:1px solid var(--line); }
.status.on { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 50%, var(--line)); } .status.off { color:var(--bad); }
.rule { margin:14px 0; padding:10px 14px; border-left:3px solid var(--acc); background:color-mix(in srgb, var(--acc) 8%, var(--card)); border-radius:8px; font-size:13.5px; }
nav { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:10px 0 16px; overflow-x:auto; }
nav button { background:none; border:0; border-bottom:2px solid transparent; color:var(--mute); padding:10px 14px; font:600 14px Inter, sans-serif; cursor:pointer; white-space:nowrap; border-radius:0; }
nav button.on { color:var(--ink); border-color:var(--acc); }
.grid { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:16px; } @media (max-width:820px) { .grid { grid-template-columns:minmax(0,1fr); } }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; } .narrow { max-width:620px; }
label { display:block; font-size:13px; color:var(--mute); margin:10px 0 4px; }
input { width:100%; background:var(--field); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font:500 14px "JetBrains Mono", monospace; min-width:0; }
input:focus { outline:2px solid color-mix(in srgb, var(--acc) 40%, transparent); border-color:var(--acc); }
.row { display:flex; gap:8px; margin:6px 0; } .row input { flex:1; }
button { background:var(--acc); color:#fff; border:1px solid var(--acc); border-radius:8px; padding:8px 14px; font:600 14px Inter, sans-serif; cursor:pointer; white-space:nowrap; }
button.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
form button[type=submit] { margin-top:14px; }
.tw { overflow-x:auto; } table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle; } th { font-size:12px; color:var(--mute); font-weight:600; }
.mono { font-family:"JetBrains Mono", monospace; font-size:12.5px; word-break:break-all; } .mute { color:var(--mute); }
.ok { color:var(--ok); } .bad { color:var(--bad); }
.pill { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--mute); }
.s-done { color:var(--ok); border-color:var(--ok); } .s-failed, .s-rejected { color:var(--bad); border-color:var(--bad); }
.code { position:relative; margin:10px 0; } .code pre { margin:0; background:var(--field); border:1px solid var(--line); border-radius:10px; padding:12px; overflow-x:auto; font:12.5px/1.45 "JetBrains Mono", monospace; }
.code .copy { position:absolute; top:8px; right:8px; padding:4px 10px; font-size:12px; background:var(--card); }
.tools { display:flex; gap:8px; align-items:center; }
footer { color:var(--mute); font-size:12.5px; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>INBREAZ <span>OTC</span></h1>
    <div class="tools"><span id="status" class="status">…</span><button id="lang" class="ghost">RU</button></div>
  </header>
  <div id="rule" class="rule"></div>
  <nav>
    <button data-tab="board" data-label="board" class="on">Board</button>
    <button data-tab="deals" data-label="myDeals">My deals</button>
    <button data-tab="settings" data-label="settings">Settings</button>
  </nav>
  <main id="main"></main>
  <footer>Peer-to-peer over Trac Intercom · settlement with TAP hashlock locks on Bitcoin · no server, no custody, no keys in this app.</footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
